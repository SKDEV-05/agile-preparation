<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Strict 4-Color Gradients: #0A0A0A, #10B981, #22C55E, #FFFFFF -->
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="emeraldGlowTop" cx="15%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlowBottom" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="emeraldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="ctaButtonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Platform Logo Prism Gradients -->
    <linearGradient id="logoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="logoLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>

    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
      .font-extrabold { font-weight: 800; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlowTop)"/>
  <rect width="1200" height="630" fill="url(#greenGlowBottom)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Outer Glass Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.2"/>

  <!-- Top Accent Shimmer Bar -->
  <rect x="64" y="28" width="1072" height="3" rx="1.5" fill="url(#emeraldBarGrad)"/>

  <!-- 2. Header: New Transparent Brand Logo & Title -->
  <g transform="translate(64, 56)">
    <!-- 3D Prism Logo Mark -->
    <g transform="translate(0, 0)">
      <!-- Top facet -->
      <path d="M26 4L46 15L26 26L6 15L26 4Z" fill="url(#logoTopGrad)" />
      <!-- Left facet -->
      <path d="M6 15L26 26V48L6 37V15Z" fill="url(#logoLeftGrad)" />
      <!-- Right facet -->
      <path d="M26 26L46 15V37L26 48V26Z" fill="url(#logoTopGrad)" fill-opacity="0.9" />
      <!-- Brackets -->
      <path d="M19 29L13 32L19 35" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M33 29L39 32L33 35" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="28" x2="24" y2="36" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="26" cy="15" r="2.8" fill="#FFFFFF" />
    </g>

    <!-- Brand Typography -->
    <text x="62" y="30" class="font-sans font-extrabold" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">
      FULLSTACK <tspan fill="#10B981">2A</tspan>
    </text>
    <text x="62" y="49" class="font-mono font-bold" font-size="11" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="1.5">
      DÉVELOPPEMENT DIGITAL · OFPPT MAROC
    </text>
  </g>

  <!-- Top Right Official Badge -->
  <g transform="translate(830, 62)">
    <rect width="306" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.05" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="23" cy="21" r="5" fill="#10B981"/>
    <circle cx="23" cy="21" r="9" fill="#10B981" fill-opacity="0.25"/>
    <text x="40" y="26" class="font-sans font-bold" font-size="14" fill="#FFFFFF">
      Cursus Officiel &amp; Examens EFM
    </text>
  </g>

  <!-- 3. Category Tag -->
  <g transform="translate(64, 168)">
    <line x1="0" y1="9" x2="24" y2="9" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <text x="34" y="14" class="font-mono font-bold" font-size="13" fill="#10B981" letter-spacing="2">
      RÉVISION CURSUS 2ÈME ANNÉE · WEB &amp; MOBILE
    </text>
  </g>

  <!-- 4. Main Hero Headline -->
  <text x="64" y="244" class="font-sans font-extrabold" font-size="52" fill="url(#heroTextGrad)" letter-spacing="-1">
    FullStack Master · 2ème Année
  </text>

  <!-- Subtitle -->
  <text x="64" y="294" class="font-sans font-semibold" font-size="20" fill="#FFFFFF" fill-opacity="0.9">
    Plateforme d'entraînement officielle : Approche Agile &amp; React.js Moderne.
  </text>
  <text x="64" y="324" class="font-sans font-medium" font-size="18" fill="#FFFFFF" fill-opacity="0.65">
    320+ questions corrigées, simulateurs interactifs PERT/Gantt et laboratoires de code live.
  </text>

  <!-- 5. 4 Curated Badges Row (Strict 4 Colors) -->
  <!-- Badge 1: Approche Agile & Scrum -->
  <g transform="translate(64, 376)">
    <rect width="250" height="48" rx="14" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="24" cy="24" r="9" fill="#10B981" fill-opacity="0.25"/>
    <path d="M24 18V24L28 26" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="29" class="font-sans font-bold" font-size="14" fill="#FFFFFF">
      Approche Agile &amp; Scrum
    </text>
  </g>

  <!-- Badge 2: React.js & Redux -->
  <g transform="translate(328, 376)">
    <rect width="250" height="48" rx="14" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4" stroke-width="1"/>
    <!-- React atom icon -->
    <ellipse cx="24" cy="24" rx="8" ry="3" fill="none" stroke="#22C55E" stroke-width="1.3" transform="rotate(30 24 24)"/>
    <ellipse cx="24" cy="24" rx="8" ry="3" fill="none" stroke="#22C55E" stroke-width="1.3" transform="rotate(-30 24 24)"/>
    <circle cx="24" cy="24" r="1.8" fill="#22C55E"/>
    <text x="44" y="29" class="font-sans font-bold" font-size="14" fill="#FFFFFF">
      React.js &amp; Redux Toolkit
    </text>
  </g>

  <!-- Badge 3: 320+ Questions Corrigées -->
  <g transform="translate(592, 376)">
    <rect width="255" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Doc icon -->
    <rect x="16" y="14" width="16" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="20" y1="20" x2="28" y2="20" stroke="#FFFFFF" stroke-width="1.6"/>
    <line x1="20" y1="25" x2="28" y2="25" stroke="#FFFFFF" stroke-width="1.6"/>
    <text x="44" y="29" class="font-sans font-bold" font-size="14" fill="#FFFFFF">
      320+ QCM &amp; Examens
    </text>
  </g>

  <!-- Badge 4: Simulateurs & Labo -->
  <g transform="translate(861, 376)">
    <rect width="275" height="48" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Flask icon -->
    <path d="M19 15H29M24 15V23L29 31C29.6 32 28.8 33 27.6 33H20.4C19.2 33 18.4 32 19 31L24 23" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="29" class="font-sans font-bold" font-size="14" fill="#FFFFFF">
      Simulateurs PERT &amp; Labs
    </text>
  </g>

  <!-- 6. Footer Divider -->
  <line x1="64" y1="492" x2="1136" y2="492" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Call to Action Button -->
  <g transform="translate(64, 518)" filter="url(#ogShadow)">
    <rect width="320" height="54" rx="16" fill="url(#ctaButtonGrad)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <text x="28" y="34" class="font-sans font-extrabold" font-size="18" fill="#FFFFFF" letter-spacing="-0.2">
      Commencer l'entraînement
    </text>
    <!-- Arrow -->
    <path d="M 276 27 L 294 27 M 287 20 L 294 27 L 287 34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Free indicator & URL -->
  <g transform="translate(685, 526)">
    <circle cx="16" cy="18" r="10" fill="#10B981" fill-opacity="0.2"/>
    <polyline points="11,18 15,22 21,14" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="23" class="font-sans font-bold" font-size="15" fill="#FFFFFF" fill-opacity="0.85">
      100% Gratuit &amp; Libre d'accès
    </text>
  </g>

  <g transform="translate(920, 522)">
    <rect width="216" height="44" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
    <text x="18" y="27" class="font-mono font-bold" font-size="13" fill="#10B981">
      fullstack-2a.vercel.app
    </text>
  </g>
</svg>
