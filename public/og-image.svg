<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <radialGradient id="indigoGlow" cx="12%" cy="12%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="88%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="65%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>

    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Consolas', monospace; }
      .font-extrabold { font-weight: 800; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#techGrid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="64" y="23" width="1072" height="3" rx="1.5" fill="url(#topLineGrad)"/>

  <!-- 2. Header Section -->
  <!-- Brand Icon -->
  <g transform="translate(64, 56)">
    <rect width="52" height="52" rx="14" fill="#4F46E5" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M26 13 L39 26 L26 39 L13 26 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="26" cy="26" r="4.5" fill="#14B8A6"/>
  </g>

  <!-- Brand Title -->
  <text x="132" y="82" class="font-sans font-extrabold" font-size="25" fill="#FFFFFF" letter-spacing="-0.5">
    FULLSTACK <tspan fill="#38BDF8">2A</tspan>
  </text>
  <text x="132" y="103" class="font-mono font-bold" font-size="12" fill="#94A3B8" letter-spacing="1.5">
    DEVELOPPEMENT DIGITAL · OFPPT MAROC
  </text>

  <!-- Top Right Badge: Cursus Officiel -->
  <g transform="translate(836, 61)">
    <rect width="300" height="42" rx="21" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="23" cy="21" r="5" fill="#10B981"/>
    <circle cx="23" cy="21" r="9" fill="#10B981" fill-opacity="0.25"/>
    <text x="40" y="26" class="font-sans font-bold" font-size="14" fill="#E2E8F0">
      Cursus Officiel &amp; Examens EFM
    </text>
  </g>

  <!-- 3. Category Tag -->
  <line x1="64" y1="177" x2="84" y2="177" stroke="#818CF8" stroke-width="3" stroke-linecap="round"/>
  <text x="94" y="181" class="font-mono font-bold" font-size="13" fill="#818CF8" letter-spacing="2">
    REVISION CURSUS 2EME ANNEE · WEB FULL STACK
  </text>

  <!-- 4. Hero Title -->
  <text x="64" y="252" class="font-sans font-extrabold" font-size="54" fill="url(#textGrad)" letter-spacing="-1">
    FullStack Master · 2ème Année
  </text>

  <!-- Subtitle -->
  <text x="64" y="302" class="font-sans font-medium" font-size="20" fill="#CBD5E1">
    Révisez le cursus Développement Digital OFPPT : cours interactifs, 200 QCM corrigés,
  </text>
  <text x="64" y="332" class="font-sans font-medium" font-size="20" fill="#94A3B8">
    simulateurs interactifs PERT/Gantt et préparation complète aux examens.
  </text>

  <!-- 5. Badges Row -->
  <!-- Badge 1: 200 QCM Corrigés -->
  <g transform="translate(64, 386)">
    <rect width="210" height="44" rx="12" fill="#4F46E5" fill-opacity="0.18" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Icon doc -->
    <rect x="16" y="12" width="16" height="20" rx="3" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>
    <line x1="20" y1="17" x2="28" y2="17" stroke="#C7D2FE" stroke-width="1.5"/>
    <line x1="20" y1="22" x2="28" y2="22" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="42" y="27" class="font-sans font-bold" font-size="15" fill="#C7D2FE">200 QCM Corrigés</text>
  </g>

  <!-- Badge 2: Simulateurs PERT & Gantt -->
  <g transform="translate(290, 386)">
    <rect width="265" height="44" rx="12" fill="#06B6D4" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Icon bolt -->
    <polygon points="25,12 19,23 24,23 22,32 30,21 25,21" fill="#A5F3FC"/>
    <text x="42" y="27" class="font-sans font-bold" font-size="15" fill="#A5F3FC">Simulateurs PERT &amp; Gantt</text>
  </g>

  <!-- Badge 3: Modules M201 - M204 -->
  <g transform="translate(571, 386)">
    <rect width="235" height="44" rx="12" fill="#A855F7" fill-opacity="0.15" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Icon grid -->
    <rect x="16" y="14" width="6" height="6" rx="1" fill="#E9D5FF"/>
    <rect x="25" y="14" width="6" height="6" rx="1" fill="#E9D5FF"/>
    <rect x="16" y="23" width="6" height="6" rx="1" fill="#E9D5FF"/>
    <rect x="25" y="23" width="6" height="6" rx="1" fill="#E9D5FF"/>
    <text x="42" y="27" class="font-sans font-bold" font-size="15" fill="#E9D5FF">Modules M201 - M204</text>
  </g>

  <!-- Badge 4: 100% Conforme EFM -->
  <g transform="translate(822, 386)">
    <rect width="215" height="44" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#34D399" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Icon shield -->
    <polygon points="24,12 32,16 32,25 24,31 16,25 16,16" fill="none" stroke="#A7F3D0" stroke-width="1.5"/>
    <polyline points="20,22 23,25 28,19" fill="none" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="42" y="27" class="font-sans font-bold" font-size="15" fill="#A7F3D0">100% Conforme EFM</text>
  </g>

  <!-- 6. Footer Divider -->
  <line x1="64" y1="512" x2="1136" y2="512" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- CTA Button -->
  <g transform="translate(64, 534)" filter="url(#shadowFilter)">
    <rect width="345" height="56" rx="16" fill="url(#ctaGrad)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="26" y="35" class="font-sans font-extrabold" font-size="19" fill="#FFFFFF" letter-spacing="-0.2">
      Commencer l'entraînement
    </text>
    <!-- Arrow -->
    <path d="M 300 28 L 318 28 M 311 21 L 318 28 L 311 35" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Indicators: Free + Domain -->
  <g transform="translate(685, 534)">
    <circle cx="16" cy="28" r="9" fill="#10B981" fill-opacity="0.2"/>
    <polyline points="12,28 15,31 20,25" fill="none" stroke="#10B981" stroke-width="2"/>
    <text x="32" y="33" class="font-sans font-semibold" font-size="15" fill="#94A3B8">
      100% Libre &amp; Gratuit
    </text>
  </g>

  <g transform="translate(906, 540)">
    <rect width="230" height="44" rx="10" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="18" y="27" class="font-mono font-bold" font-size="14" fill="#38BDF8">
      fullstack-2a.vercel.app
    </text>
  </g>
</svg>
